name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/apk
            git pull
            docker compose build
            docker compose up -d
            # Авто-очистка после деплоя → ручной `docker builder prune -a` больше не нужен.
            # `prune -f` (без -a) убирает только висячий кеш прошлых сборок;
            # кеш свежесобранных api/web остаётся тёплым для быстрых пересборок.
            # (На Docker 27+ можно ограничить кеш по размеру: `--reserved-space 20GB`.)
            docker builder prune -f
            docker image prune -f
